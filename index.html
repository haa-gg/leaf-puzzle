<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SENTIENCE VALIDATION IN PROGRESS</title>
  <meta property="og:title" content="SENTIENCE VALIDATION IN PROGRESS">
  <meta property="og:description" content="Information on The Third Impact Inside. May the leaves guide you.">
  <meta property="og:image" content="images/og-img.png">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="scene">
    <div id="board-wrap">
      <div id="board"></div>
    </div>

    <div id="sidebar">
      <div id="tree-logo">
        <div id="logo-glyph">&#10023;</div>
        <div id="logo-title">The End is Stoppable.</div>
        <div id="logo-sub">Information on The Third Impact Inside<br>
          May the leaves guide you.</div>
      </div>

      <div id="letter-panel">
        <div id="sequence-display">
          <span id="seq-1" class="seq-dot">_</span>
          <span id="seq-2" class="seq-dot">_</span>
          <span id="seq-3" class="seq-dot">_</span>
          <span id="seq-4" class="seq-dot">_</span>
        </div>

        <div id="letter-grid">
          <button class="letter-btn" data-letter="A">A</button>
          <button class="letter-btn" data-letter="B">B</button>
          <button class="letter-btn" data-letter="C">C</button>
          <button class="letter-btn" data-letter="D">D</button>
          <button class="letter-btn" data-letter="E">E</button>
          <button class="letter-btn" data-letter="F">F</button>
          <button class="letter-btn" data-letter="G">G</button>
          <button class="letter-btn" data-letter="H">H</button>
          <button class="letter-btn" data-letter="I">I</button>
        </div>

        <button id="clear-btn">&#x2715; Clear</button>
      </div>
    </div>
  </div>

  <div id="unlock-overlay" class="hidden">
    <div id="unlock-box">
      <div id="unlock-glyph">&#10022;</div>
      <h2 id="unlock-title">Nice try, punk!</h2>
      <div id="unlock-message">
        <p>This aint the secret >:P</p>
      </div>
      <button id="unlock-close">&#8592; Go Back</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>

</html>
